<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#080a10">
  <title>Kickoff privado · Very Good Graphics</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#07090f;--panel:#11151f;--line:rgba(255,255,255,.12);--text:#f7f7f2;--muted:#9da2b5;--lime:#e8ff00;--purple:#7b2cff;--green:#57e389}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,rgba(123,44,255,.33),transparent 36%),var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif}.shell{width:min(1120px,calc(100% - 34px));margin:auto}.top{display:flex;justify-content:space-between;padding:25px 0;border-bottom:1px solid var(--line)}.brand{font:900 16px 'Montserrat'}.brand span,.lime{color:var(--lime)}.hero{padding:75px 0 48px}.eyebrow{color:#af87ff;font:800 11px 'Montserrat';letter-spacing:.18em}.hero h1{font:900 clamp(42px,7vw,82px)/.93 'Montserrat';letter-spacing:-.06em;text-transform:uppercase;max-width:940px;margin:14px 0}.hero p{max-width:700px;color:var(--muted);font-size:17px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:17px;padding-bottom:65px}.card{border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(18,22,32,.95),rgba(10,12,19,.9));padding:27px}.card h2{font:800 22px 'Montserrat';margin:0 0 18px}.card p{color:var(--muted);line-height:1.7}.list{display:grid;gap:10px;list-style:none;padding:0}.list li{padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025)}.actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:15px;background:linear-gradient(120deg,rgba(123,44,255,.22),rgba(232,255,0,.08))}.price{font:900 38px 'Montserrat';color:var(--lime);display:block;margin:8px 0}.button{display:flex;min-height:52px;align-items:center;justify-content:center;border-radius:12px;border:1px solid var(--line);background:var(--lime);color:#080a10;font:800 12px 'Montserrat';text-decoration:none;cursor:pointer}.button.secondary{background:rgba(255,255,255,.05);color:var(--text)}.confirm{grid-column:1/-1}.confirmed{padding:15px;border:1px solid rgba(87,227,137,.3);border-radius:12px;background:rgba(87,227,137,.08);color:var(--green)}.error{min-height:60vh;display:grid;place-items:center;text-align:center}.error h1{font:900 36px 'Montserrat'}@media(max-width:720px){.grid,.actions{grid-template-columns:1fr}.hero{padding-top:48px}.card{padding:21px}.confirm{grid-column:auto}}
  </style>
</head>
<body><main id="app"><div class="error"><p>Cargando kickoff privado…</p></div></main>
<script>
  const app=document.querySelector('#app'),token=new URLSearchParams(location.hash.slice(1)).get('t')||'';
  const safe=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(Number(v||0));const date=v=>v?new Intl.DateTimeFormat('es-MX',{dateStyle:'long'}).format(new Date(v+'T12:00:00')):'por confirmar';const list=items=>`<ul class="list">${(items||[]).map(x=>`<li>${safe(x)}</li>`).join('')}</ul>`;
  async function load(){try{const r=await fetch('/api/vgg-public-kickoff',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action:'view'}),cache:'no-store'});const b=await r.json();if(!r.ok)throw new Error(b.error);render(b.kickoff)}catch(e){app.innerHTML=`<div class="error"><div><p class="eyebrow">KICKOFF PRIVADO</p><h1>No fue posible abrirlo.</h1><p>${safe(e.message||'Solicita una liga nueva a VGG.')}</p></div></div>`}}
  function render(k){const who=k.client.company||k.client.name||'tu equipo';app.innerHTML=`<div class="shell"><header class="top"><div class="brand">VERY <span>GOOD</span> GRAPHICS</div><div class="eyebrow">INICIO FORMAL</div></header><section class="hero"><p class="eyebrow">KICKOFF · ${safe(k.project.service)}</p><h1>${safe(k.headline)}</h1><p>Preparamos esta ruta para ${safe(who)}. Aquí están los objetivos, entregables y los dos pasos que nos permiten arrancar con claridad.</p></section><section class="grid"><article class="card"><p class="eyebrow">OBJETIVOS</p><h2>Qué vamos a lograr</h2>${list(k.objectives)}</article><article class="card"><p class="eyebrow">ENTREGABLES</p><h2>Qué vamos a producir</h2>${list(k.deliverables)}</article><article class="card"><p class="eyebrow">PROCESO</p><h2>Cómo avanzaremos</h2>${list(k.process_steps)}</article><article class="card"><p class="eyebrow">CALENDARIO</p><h2>${safe(k.project.name)}</h2><p>Inicio estimado: <b>${date(k.start_date)}</b><br>Entrega objetivo: <b>${date(k.due_date)}</b></p></article><article class="card actions"><div><p class="eyebrow">PASO 1 · ANTICIPO</p><h2>Confirma la inversión</h2><span class="price">${money(k.deposit_amount_mxn)}</span><p>${k.deposit_percent}% del proyecto. El pago será verificado por VGG antes de iniciar producción.</p>${k.payment_url?`<a class="button" href="${safe(k.payment_url)}" target="_blank" rel="noopener">Realizar anticipo →</a>`:'<p>VGG compartirá la liga de pago.</p>'}</div><div><p class="eyebrow">PASO 2 · SESIÓN</p><h2>Agenda el kickoff</h2><p>Revisaremos objetivos, responsables, materiales, calendario y criterios de aprobación.</p>${k.calendar_url?`<a class="button secondary" href="${safe(k.calendar_url)}" target="_blank" rel="noopener">Agendar sesión →</a>`:'<p>VGG confirmará la disponibilidad.</p>'}</div><div class="confirm" id="confirm-zone">${k.confirmed_at?'<div class="confirmed"><b>Pasos reportados</b><br>VGG verificará el pago y la fecha agendada.</div>':'<button class="button" id="confirm">Ya completé pago y agenda; solicitar verificación</button>'}</div></article></section></div>`;document.querySelector('#confirm')?.addEventListener('click',confirm)}
  async function confirm(e){e.currentTarget.disabled=true;e.currentTarget.textContent='Enviando…';try{const r=await fetch('/api/vgg-public-kickoff',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action:'confirm'})});const b=await r.json();if(!r.ok)throw new Error(b.error);await load()}catch(err){e.currentTarget.disabled=false;e.currentTarget.textContent='Intentar nuevamente';alert(err.message)}}load();
</script></body></html>
