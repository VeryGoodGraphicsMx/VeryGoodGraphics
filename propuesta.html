<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#080a10">
  <title>Propuesta privada · Very Good Graphics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#07090f;--panel:#11151f;--line:rgba(255,255,255,.12);--text:#f7f7f2;--muted:#a2a6b7;--lime:#e8ff00;--purple:#7b2cff;--green:#57e389}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,rgba(123,44,255,.3),transparent 35%),var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif}a{color:inherit}.shell{width:min(1100px,calc(100% - 34px));margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:25px 0;border-bottom:1px solid var(--line)}.brand{font:900 16px 'Montserrat';letter-spacing:-.03em}.brand span{color:var(--lime)}.private{font-size:10px;color:var(--muted);letter-spacing:.16em}.hero{padding:70px 0 42px}.eyebrow{color:#ae83ff;font:800 11px 'Montserrat';letter-spacing:.18em}.hero h1{font:900 clamp(40px,7vw,78px)/.95 'Montserrat';letter-spacing:-.06em;text-transform:uppercase;max-width:900px;margin:15px 0}.hero>p{max-width:720px;color:var(--muted);font-size:17px;line-height:1.7}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;padding-bottom:70px}.card{border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(18,22,32,.95),rgba(10,12,19,.9));padding:28px}.card h2{font:800 23px 'Montserrat';margin:0 0 18px}.card p{color:var(--muted);line-height:1.7}.list{display:grid;gap:10px;padding:0;list-style:none}.list li{padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025)}.price-card{position:sticky;top:18px}.price-label{font-size:10px;color:var(--muted);letter-spacing:.14em}.was{display:block;margin:13px 0 3px;color:var(--muted);font-size:18px;text-decoration:line-through}.now{display:block;font:900 42px 'Montserrat';color:var(--lime)}.saving{display:inline-flex;margin:15px 0;padding:9px 12px;border-radius:999px;background:rgba(87,227,137,.12);color:var(--green);font-weight:700;font-size:12px}.deadline{padding:14px;border-left:3px solid var(--lime);background:rgba(232,255,0,.06);font-size:12px;color:#dfe1c5}.accept{display:grid;gap:11px;margin-top:22px}.accept input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:#090c13;color:var(--text)}button,.pay{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border:0;border-radius:12px;background:var(--lime);color:#080a10;font:800 12px 'Montserrat';cursor:pointer;text-decoration:none}.status{padding:16px;border:1px solid rgba(87,227,137,.3);border-radius:13px;background:rgba(87,227,137,.08);color:var(--green)}.muted{color:var(--muted);font-size:11px}.full{grid-column:1/-1}.error{min-height:60vh;display:grid;place-items:center;text-align:center}.error h1{font:900 36px 'Montserrat'}@media(max-width:760px){.grid{grid-template-columns:1fr}.price-card{position:static}.hero{padding-top:45px}.card{padding:21px}}
  </style>
  <link rel="icon" href="/media/favicon.ico" sizes="any">
  <link rel="icon" href="/media/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/media/favicon-48.png" type="image/png" sizes="48x48">
  <link rel="apple-touch-icon" href="/media/apple-touch-icon.png" sizes="180x180"></head>
<body><main id="app"><div class="error"><p>Cargando propuesta privada…</p></div></main>
<script>
  const app=document.querySelector('#app'),token=new URLSearchParams(location.hash.slice(1)).get('t')||'';
  const safe=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=(v)=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(Number(v||0));
  const date=(v)=>v?new Intl.DateTimeFormat('es-MX',{dateStyle:'long'}).format(new Date(v)):'por acordar';
  const list=(items)=>`<ul class="list">${(items||[]).map(x=>`<li>${safe(x)}</li>`).join('')}</ul>`;
  async function load(){try{const r=await fetch('/api/vgg-public-proposal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action:'view'}),cache:'no-store'});const b=await r.json();if(!r.ok)throw new Error(b.error);render(b.proposal)}catch(e){app.innerHTML=`<div class="error"><div><p class="eyebrow">PROPUESTA PRIVADA</p><h1>No fue posible abrirla.</h1><p>${safe(e.message||'Solicita una liga nueva a VGG.')}</p></div></div>`}}
  function render(p){const discounted=p.savings_mxn>0;const accepted=p.status==='accepted';app.innerHTML=`<div class="shell"><header class="top"><div class="brand">VERY <span>GOOD</span> GRAPHICS</div><div class="private">DOCUMENTO PRIVADO</div></header><section class="hero"><p class="eyebrow">PROPUESTA PARA ${safe(p.client.company||p.client.name||'TU PROYECTO')}</p><h1>${safe(p.title)}</h1><p>${safe(p.client_message||p.scope)}</p></section><section class="grid"><article class="card"><p class="eyebrow">ALCANCE</p><h2>Lo que vamos a resolver</h2><p>${safe(p.scope)}</p></article><aside class="card price-card"><p class="price-label">INVERSIÓN PROPUESTA</p>${discounted?`<span class="was">${money(p.list_price_mxn)}</span>`:''}<strong class="now">${money(p.amount_mxn)}</strong>${discounted?`<span class="saving">Ahorras ${money(p.savings_mxn)}</span><div class="deadline"><b>${safe(p.discount_label||'Beneficio aplicado')}</b><br>${p.discount_expired?'La vigencia terminó. Solicita una actualización.':`Disponible al confirmar antes del ${date(p.discount_expires_at)}.`}</div>`:''}<div id="accept-zone">${accepted?`<div class="status"><b>Propuesta aceptada</b><br>VGG está preparando el anticipo y el kickoff.</div>${p.payment_url?`<a class="pay" style="margin-top:12px" href="${safe(p.payment_url)}" target="_blank" rel="noopener">Realizar anticipo →</a>`:''}`:`<form class="accept" id="accept-form"><input name="name" placeholder="Nombre de quien acepta" required><input name="email" type="email" placeholder="Correo de confirmación" required><input name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px"><button ${p.discount_expired?'disabled':''}>${discounted?`Aceptar y conservar ${money(p.savings_mxn)} de ahorro`:'Aceptar propuesta'} →</button><small class="muted">Al aceptar confirmas el alcance e inversión; pago y calendario se validan por separado.</small></form>`}</div></aside>${p.deliverables?.length?`<article class="card"><p class="eyebrow">ENTREGABLES</p><h2>Qué incluye</h2>${list(p.deliverables)}</article>`:''}${p.timeline?.length?`<article class="card"><p class="eyebrow">RUTA DE TRABAJO</p><h2>Cómo avanzaremos</h2>${list(p.timeline)}</article>`:''}</section></div>`;document.querySelector('#accept-form')?.addEventListener('submit',accept)}
  async function accept(e){e.preventDefault();const button=e.submitter;button.disabled=true;button.textContent='Confirmando…';try{const body=Object.fromEntries(new FormData(e.currentTarget));body.token=token;body.action='accept';const r=await fetch('/api/vgg-public-proposal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const b=await r.json();if(!r.ok)throw new Error(b.error);await load()}catch(err){button.disabled=false;button.textContent='Intentar nuevamente';alert(err.message)}}
  load();
</script></body></html>
