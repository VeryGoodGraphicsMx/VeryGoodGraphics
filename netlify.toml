[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/favicon.ico"
  to = "/media/logo.webp"
  status = 200

[[redirects]]
  from = "/crm/gracias.html"
  to = "/gracias.html"
  status = 200

[[redirects]]
  from = "/api/vgg-form-config"
  to = "/.netlify/functions/vgg-form-config"
  status = 200

[[redirects]]
  from = "/api/vgg-crm/config"
  to = "/.netlify/functions/vgg-crm-config"
  status = 200

[[redirects]]
  from = "/api/vgg-crm/data"
  to = "/.netlify/functions/vgg-crm-data"
  status = 200

[[redirects]]
  from = "/api/vgg-crm/action"
  to = "/.netlify/functions/vgg-crm-action"
  status = 200

[[redirects]]
  from = "/api/vgg-crm/intake"
  to = "/.netlify/functions/vgg-lead-intake"
  status = 200

[[redirects]]
  from = "/api/vgg-public-proposal"
  to = "/.netlify/functions/vgg-public-proposal"
  status = 200

[[redirects]]
  from = "/api/vgg-public-kickoff"
  to = "/.netlify/functions/vgg-public-kickoff"
  status = 200

[[headers]]
  for = "/crm/*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/api/vgg-crm/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/propuesta.html"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/kickoff.html"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/api/vgg-public-*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow, noarchive"
